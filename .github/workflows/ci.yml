name: CI

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main", "dev"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # The robot workspace: thumbv8m firmware plus the two shared `no_std` crates.
  robot:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: thumbv8m.main-none-eabihf
          components: clippy

      - name: Install latest nightly rustfmt
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: true

      - name: Check formatting
        run: cargo +nightly fmt --all -- --check

      - name: Run clippy (default features)
        run: cargo clippy --workspace --target thumbv8m.main-none-eabihf --no-deps -- -D warnings

      - name: Run clippy (all features)
        run: cargo clippy --workspace --target thumbv8m.main-none-eabihf --all-features --no-deps -- -D warnings

      - name: Run clippy (examples, coin-d6)
        run: cargo clippy -p coin-d6 --target thumbv8m.main-none-eabihf --examples --no-deps -- -D warnings

      - name: Run clippy (examples, st7789-async)
        run: cargo clippy -p st7789-async --target thumbv8m.main-none-eabihf --examples --no-deps -- -D warnings

      - name: Run clippy (examples, hardware-tests)
        run: cargo clippy -p hardware-tests --target thumbv8m.main-none-eabihf --examples --no-deps -- -D warnings

      - name: Build
        run: cargo build --workspace --release --verbose --target thumbv8m.main-none-eabihf

      - name: Build examples (coin-d6)
        run: cargo build -p coin-d6 --release --verbose --target thumbv8m.main-none-eabihf --examples

      - name: Build examples (st7789-async)
        run: cargo build -p st7789-async --release --verbose --target thumbv8m.main-none-eabihf --examples

      - name: Build examples (hardware-tests)
        run: cargo build -p hardware-tests --release --verbose --target thumbv8m.main-none-eabihf --examples

      - name: Test coin-d6 (host)
        run: cargo test -p coin-d6 --features std --target x86_64-unknown-linux-gnu --tests

      - name: Test touch-async (host)
        run: cargo test -p touch-async --features std --target x86_64-unknown-linux-gnu --tests

      - name: Test lidar-cloud (host)
        run: cargo test -p lidar-cloud --features std --target x86_64-unknown-linux-gnu --tests

      - name: Test touch-ui (host)
        run: cargo test -p touch-ui --features std --target x86_64-unknown-linux-gnu --tests

      - name: Test link-protocol (host)
        run: cargo test -p link-protocol --features std --target x86_64-unknown-linux-gnu --tests

      - name: Test link-core (host)
        run: cargo test -p link-core --features std --target x86_64-unknown-linux-gnu --tests

      - name: Test claim-slot (host)
        run: cargo test -p claim-slot --features std --target x86_64-unknown-linux-gnu --tests

  # The Bridge workspace: RISC-V, `no_std`, build-std. This job also compiles both shared crates
  # for the C3, which is the real cross-target gate (ADR-0040).
  bridge:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: bridge

    steps:
      - uses: actions/checkout@v4

      - name: Install the Bridge toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: riscv32imc-unknown-none-elf
          components: rust-src, clippy

      - name: Install latest nightly rustfmt
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "bridge -> target"

      - name: Check formatting
        run: cargo +nightly fmt --all -- --check

      - name: Build
        run: cargo build

      # A `no_std` binary cannot build the built-in test harness, so `--all-targets` fails with
      # "can't find crate for test" and a missing `panic_handler`. Gate the bin target only.
      - name: Run clippy (bin target only)
        run: cargo clippy -- -D warnings

      # The pump rules are host-tested behind `bridge-core`'s `std` feature. The explicit host
      # target overrides this workspace's RISC-V default; `rust-src` above supplies the
      # `build-std` crates for that target too.
      - name: Test bridge-core (host)
        run: cargo test -p bridge-core --features std --target x86_64-unknown-linux-gnu --tests

      - name: Run clippy (bridge-core, host)
        run: cargo clippy -p bridge-core --features std --target x86_64-unknown-linux-gnu --tests -- -D warnings

  # The host workspace: the daemon, `bridge-net` and their host tests.
  remote:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: remote

    steps:
      - uses: actions/checkout@v4

      # `robot-stub` depends on `serialport`, which links libudev on Linux.
      - name: Install libudev build dependencies
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy

      - name: Install latest nightly rustfmt
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "remote -> target"

      - name: Check formatting
        run: cargo +nightly fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --workspace

      - name: Build
        run: cargo build --workspace

  # The live docs: every relative link and image in tracked Markdown must resolve.
  docs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check Markdown links
        run: python3 .github/scripts/check_links.py
