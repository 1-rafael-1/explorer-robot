[package]
name = "bridge-core"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "The Bridge's HAL-agnostic pump rules: coalescing, routing, watermark hints and the client gate."
repository = "https://github.com/1-rafael-1/explorer-robot"

[features]
# Host tests only. The crate itself is always `no_std`.
std = ["remote-protocol/std"]

[dependencies]
remote-protocol = { path = "../../remote-protocol", version = "1" }

# The same clippy gate as the other workspaces (ADR-0040). The `bridge-firmware`
# workspace declares no workspace-level table yet, so the crate states its own
# rather than silently inheriting nothing.
[lints.clippy]
all = { level = "warn", priority = 1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "warn"
missing_docs_in_private_items = "warn"
cargo_common_metadata = "allow"
future_not_send = "allow"
multiple_crate_versions = "allow"

[[test]]
name = "coalescing"
required-features = ["std"]

[[test]]
name = "routing"
required-features = ["std"]

[[test]]
name = "watermark"
required-features = ["std"]

[[test]]
name = "auth"
required-features = ["std"]

[[test]]
name = "pump"
required-features = ["std"]
