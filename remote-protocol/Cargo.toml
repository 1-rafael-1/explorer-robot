[package]
name = "remote-protocol"
version = "1.0.0"
edition = "2024"
license = "MIT"
description = "Shared no_std Link Protocol contract for the robot, the Bridge and the remote daemon."
repository = "https://github.com/1-rafael-1/explorer-robot"

[features]
# Host tests and the simulated lossy link. The wire crate itself is always `no_std`.
std = []

[[test]]
name = "crc"
required-features = ["std"]

[[test]]
name = "frame"
required-features = ["std"]

[[test]]
name = "ids"
required-features = ["std"]

[[test]]
name = "parser"
required-features = ["std"]

[[test]]
name = "streams"
required-features = ["std"]

[[test]]
name = "commands"
required-features = ["std"]

[[test]]
name = "control"
required-features = ["std"]

[[test]]
name = "retry"
required-features = ["std"]

[lints]
workspace = true
