[workspace]
# A workspace of its own: this crate targets `riscv32imc-unknown-none-elf` and
# relies on `.cargo/config.toml` here for its target and runner, which the
# robot's workspace cannot provide. The root package stays a member implicitly.
members = ["bridge-core"]

# The same clippy gate as the robot and host workspaces (ADR-0040). Only members that opt in
# inherit it: `bridge-core` does, while the root `bridge-firmware` package deliberately does not
# because the pre-existing `stack-soak` spike is out of scope.
[workspace.lints.clippy]
all = { level = "warn", priority = 1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "warn"
missing_docs_in_private_items = "warn"
cargo_common_metadata = "allow"
future_not_send = "allow"
multiple_crate_versions = "allow"

[package]
edition      = "2024"
name         = "bridge-firmware"
rust-version = "1.99"
version      = "0.1.0"

# `src/bin/stack-soak.rs` is auto-discovered as the `stack-soak` binary: the ticket-09
# language spike, kept as the regression soak (see its module doc). The `bridge` firmware
# binary joins it here when ticket 04 lands.

[dependencies]
link-protocol = { path = "../robot/crates/link/link-protocol", version = "1" }
bridge-net = { path = "../remote/bridge-net", version = "1" }
bridge-core = { path = "bridge-core", version = "0.1.0" }

esp-hal = { version = "~1.2.2", features = ["defmt", "esp32c3", "unstable"] }
# The credential record's flash: `esp-storage`'s defaults keep the critical-section lock that
# guards the flash while Wi-Fi interrupts can run. `embedded-storage` supplies the sync NorFlash
# traits the partition adapter implements, and `sequential-storage` is the repo's record pattern.
esp-storage            = { version = "0.10.0", features = ["defmt", "esp32c3"] }
embedded-storage       = "0.3.1"
embassy-embedded-hal   = "0.6.0"
sequential-storage     = "7.1.0"

esp-rtos = { version = "0.4.0", features = [
  "defmt",
  "embassy",
  "esp-alloc",
  "esp-radio",
  "esp32c3",
] }

defmt                  = "1.0.1"
esp-bootloader-esp-idf = { version = "0.6.0", features = ["defmt", "esp32c3"] }

embassy-net = { version = "0.9.1", features = [
  "defmt",
  "dhcpv4",
  "medium-ethernet",
  "tcp",
  "udp",
] }
embedded-io = { version = "0.7.1", features = ["defmt"] }
embedded-io-async = { version = "0.7.0", features = ["defmt"] }
esp-alloc = { version = "0.11.0", features = ["defmt", "esp32c3"] }
esp-backtrace = { version = "0.20.0", features = [
  "defmt",
  "esp32c3",
  "panic-handler",
] }
esp-println = { version = "0.18.0", features = ["defmt-espflash", "esp32c3"] }
# for more networking protocol support see https://crates.io/crates/edge-net
embassy-executor = { version = "0.10.0", features = ["defmt"] }
embassy-sync = { version = "0.7.2", features = ["defmt"] }
embassy-time = { version = "0.5.0", features = ["defmt"] }
esp-radio = { version = "1.0.0-beta.1", features = [
  "defmt",
  "esp-alloc",
  "esp32c3",
  "unstable",
  "wifi",
] }
critical-section = "1.2.0"
heapless         = { version = "0.9", features = ["defmt", "portable-atomic"] }
portable-atomic  = "1"
static_cell      = "2.1.1"

# For fine tuning these settings, please refer to https://doc.rust-lang.org/cargo/reference/profiles.html
[profile.dev]
# The default debug profile is too slow and too big for resource-constrained devices.
# Always build with some optimizations enabled.
opt-level = "s"

[profile.release]
codegen-units = 1     # LLVM can perform better optimizations using a single thread
debug         = 2     # prefer slower builds but better debugging experience
lto           = 'fat'
opt-level     = 's'
