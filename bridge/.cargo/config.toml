# Keep compilation settings in this file and user/runtime settings in `esp-config.toml`.
include = ["esp-config.toml"]

[target.riscv32imc-unknown-none-elf]
# The same explicit flash set the README documents: bootloader, the custom table and the app. The
# data partition is deliberately not written, so the credential record survives `cargo run`.
runner = "espflash flash --monitor --chip esp32c3 --log-format defmt --partition-table partitions.csv --partition-table-offset 0x8000"

[build]
rustflags = [
  # Required to obtain backtraces (e.g. when using the "esp-backtrace" crate.)
  # NOTE: May negatively impact performance of produced code
  "-C", "force-frame-pointers",
]

target = "riscv32imc-unknown-none-elf"

[unstable]
build-std = ["alloc", "core"]
