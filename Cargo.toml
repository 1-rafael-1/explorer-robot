[workspace]
members = [
    "robot",
    "robot/crates/link/*",
    "robot/crates/drivers/*",
    "robot/crates/models/*",
    "robot/crates/hardware-tests",
]
# Separate workspaces with their own targets and runners: `bridge` is RISC-V and
# `remote` is a host workspace. Keeping both out of `members` is what stops the robot's
# `cargo check`/`clippy` from building them on `thumbv8m.main-none-eabihf` (ADR-0040).
exclude = ["bridge", "remote"]
resolver = "3"

[profile.dev]
lto = true
codegen-units = 1
debug = 2
debug-assertions = true
incremental = true
opt-level = 0

# The firmware's large async state machines (notably the LiDAR task) allocate a
# stack frame for every inlined state. At opt-level 0 that is ~178 KiB for the
# core1 LiDAR task; at opt-level 1 it folds to ~30 KiB. Optimising just this
# package in dev keeps `cargo run`/`probe-rs run` within the core1 stack while
# leaving debug info and debug assertions on and the dependencies unoptimised.
[profile.dev.package.explorer-robot]
opt-level = 1

[profile.release]
codegen-units = 1
debug = 2
debug-assertions = false
incremental = false
lto = 'fat'
opt-level = 's'

[workspace.lints.clippy]
all = { level = "warn", priority = 1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "warn"
missing_docs_in_private_items = "warn"
cargo_common_metadata = "allow"
future_not_send = "allow"
multiple_crate_versions = "allow"

# Embassy does not cut releases for every crate. The robot absorbs current embassy
# master instead of the released snapshots, pinned to one commit so the build is
# reproducible. Keep every patched crate on this same revision.
[patch.crates-io]
embassy-rp = { git = "https://github.com/embassy-rs/embassy", rev = "9b0680bdd75c6a665aabb3e760ef08ea576abaae" }
embassy-embedded-hal = { git = "https://github.com/embassy-rs/embassy", rev = "9b0680bdd75c6a665aabb3e760ef08ea576abaae" }
embassy-sync = { git = "https://github.com/embassy-rs/embassy", rev = "9b0680bdd75c6a665aabb3e760ef08ea576abaae" }
embassy-executor = { git = "https://github.com/embassy-rs/embassy", rev = "9b0680bdd75c6a665aabb3e760ef08ea576abaae" }
embassy-time = { git = "https://github.com/embassy-rs/embassy", rev = "9b0680bdd75c6a665aabb3e760ef08ea576abaae" }
embassy-futures = { git = "https://github.com/embassy-rs/embassy", rev = "9b0680bdd75c6a665aabb3e760ef08ea576abaae" }
