[workspace]
members = [
    "robot",
    "robot/crates/link/*",
    "robot/crates/drivers/*",
    "robot/crates/models/*",
    "robot/crates/hardware-tests",
]
# Separate workspaces with their own targets and runners: `bridge` is RISC-V and
# `remote` is a host workspace. Keeping both out of `members` is what stops the robot's
# `cargo check`/`clippy` from building them on `thumbv8m.main-none-eabihf` (ADR-0040).
exclude = ["bridge", "remote"]
resolver = "3"

[profile.dev]
lto = true
codegen-units = 1
debug = 2
debug-assertions = true
incremental = true
opt-level = 0

[profile.release]
codegen-units = 1
debug = 2
debug-assertions = false
incremental = true
lto = 'fat'
opt-level = 's'

[workspace.lints.clippy]
all = { level = "warn", priority = 1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "warn"
missing_docs_in_private_items = "warn"
cargo_common_metadata = "allow"
future_not_send = "allow"
multiple_crate_versions = "allow"
