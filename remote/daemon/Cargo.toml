[package]
name = "remote-daemon"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "The remote relay: raw TCP to the Bridge, one JSON WebSocket and the static app."
repository = "https://github.com/1-rafael-1/explorer-robot"

[dependencies]
remote-protocol = { path = "../../remote-protocol", version = "1" }
bridge-net = { path = "../bridge-net", version = "1" }

# The App Boundary's JSON schema (ADR-0038): the relay serialises, the app adapter deserialises.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The link adapter's transport and timers (ADR-0039).
tokio = { version = "1", features = [
    "io-util",
    "macros",
    "net",
    "rt",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
# The once-per-process Session epoch (ADR-0039) and the handshake's client nonce (ADR-0037).
getrandom = "0.3"
# The app boundary's HTTP server and the `/ws` upgrade (ADR-0039).
axum = { version = "0.8", features = ["ws"] }
# The compile-time embed of `remote/app`, with a disk override for `--assets` (ADR-0039).
include_dir = "0.7"

# The per-user token store (ADR-0039): a versioned `config.toml` under the platform's config dir.
directories = "6"
toml = "0.8"
# The CLI surface (ADR-0039): `--host/--port`, `--no-open`, `--assets`, `--config`, `--verbose`.
clap = { version = "4", features = ["derive"] }
# Opening the default browser unless `--no-open` (ADR-0039).
open = "5"

[dev-dependencies]
# The TCP/preamble seam's other end: the Bridge Stub's in-process listener (ticket 09).
bridge-stub = { path = "../bridge-stub" }
futures-util = "0.3"
tokio-tungstenite = "0.30"
# Temporary config directories for the token-store tests.
tempfile = "3"

[lints]
workspace = true
