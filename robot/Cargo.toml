[package]
name = "explorer-robot"
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Rafael Koch <rafael.koch@gmx.net>"]
description = "Explorer robot v3 — tracked robot with LiDAR-based autonomous navigation and sensor-driven obstacle avoidance, written in Rust with Embassy."
repository = "https://github.com/1-rafael-1/explorer-robot"

[features]
# Gate high-frequency diagnostic logging.
# Keep this OFF by default so release runs without a log consumer don't spend time formatting/queuing logs.
telemetry_logs = []
# Feed synthetic floor-drop readings from the VL53L0X stub. Off by default: with
# no rangefinder attached the stub alternates between solid floor and floor drop,
# which raises spurious EmergencyBrake interrupts. Enable only to exercise the
# perception/drive pipeline without sensors.
floor_drop_stub = []
# Start the IMU in Axis9 and print one orientation sample per second at INFO.
# Off by default; useful for sensor bring-up.
imu_debug = []

[lints]
workspace = true

[dependencies]
embassy-rp = { version = "0.10.0", features = [
    "defmt",
    "unstable-pac",
    "time-driver",
    "critical-section-impl",
    "rp235xb",
] }
embassy-embedded-hal = { version = "0.6.0", features = ["defmt"] }
embassy-sync = { version = "0.8.0", features = ["defmt"] }
embassy-executor = { version = "0.10.0", features = [
    "platform-cortex-m",
    "executor-thread",
    "executor-interrupt",
    "defmt",
] }
embassy-time = { version = "0.5.0", features = [
    "defmt",
    "defmt-timestamp-uptime",
] }
embassy-futures = { version = "0.1.2" }
defmt = "1.0.1"
defmt-rtt = "1.1.0"
cortex-m-rt = "0.7.5"
critical-section = "1.2.0"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
nanorand = { version = "0.8.0", features = ["wyrand"], default-features = false }
claim-slot = { path = "crates/models/claim-slot" }
st7789-async = { path = "crates/drivers/st7789-async" }
coin-d6 = { path = "crates/drivers/coin-d6" }
lidar-cloud = { path = "crates/models/lidar-cloud" }
link-core = { path = "crates/link/link-core" }
link-protocol = { path = "crates/link/link-protocol", version = "1" }
link-state = { path = "crates/models/link-state" }
moving_median = "0.4.0"
touch-async = { path = "crates/drivers/touch-async" }
touch-ui = { path = "crates/models/touch-ui" }
embedded-graphics = "0.8.1"
static_cell = { version = "2.1.1", features = [] }
heapless = "0.9.2"
micromath = "2.1.0"
libm = "0.2"
icm20948-rs = { version = "0.3.0", features = ["async", "defmt", "dmp"] }
nalgebra = { version = "0.34", default-features = false, features = ["libm"] }
embedded-hal-async = "1.0.0"
embedded-io-async = "0.7.0"
sequential-storage = "7.1.0"
embedded-storage-async = "0.4.1"
assign-resources = "0.5.0"
