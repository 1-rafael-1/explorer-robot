[package]
name = "indicator-led"
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Rafael Koch <rafael.koch@gmx.net>"]
description = "Pure pack-voltage to red/green duty mapping for the RGB indicator LED. no_std and host-tested."
repository = "https://github.com/1-rafael-1/explorer-robot"

[lints]
workspace = true

[dependencies]
libm = "0.2"

[features]
# Host test harness only; the crate itself is always `no_std`.
std = []

[[test]]
name = "indicator_led"
required-features = ["std"]
