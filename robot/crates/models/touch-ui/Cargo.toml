[package]
name = "touch-ui"
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Rafael Koch <rafael.koch@gmx.net>"]
description = "Host-testable touch UI model for the explorer-robot's ST7789 panel"
repository = "https://github.com/1-rafael-1/explorer-robot"

[lints]
workspace = true

[dependencies]
dmp-cal = { path = "../dmp-cal" }
embedded-graphics = { version = "0.8.1", default-features = false }
libm = "0.2"
link-state = { path = "../link-state" }

[features]
std = []

[[test]]
name = "ui"
required-features = ["std"]
