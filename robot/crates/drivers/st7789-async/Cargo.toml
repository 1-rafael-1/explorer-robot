[package]
name = "st7789-async"
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Rafael Koch <rafael.koch@gmx.net>"]
description = "Hand-rolled async ST7789 TFT display driver (framebuffer + async SPI flush)"
repository = "https://github.com/1-rafael-1/explorer-robot"

[lints]
workspace = true

[dependencies]
embedded-graphics = "0.8.1"
embedded-hal = "1.0.0"
embedded-hal-async = "1.0.0"

[dev-dependencies]
embedded-hal-bus = { version = "0.1.0", features = ["async"] }
embassy-rp = { version = "0.10.0", features = [
    "defmt",
    "unstable-pac",
    "time-driver",
    "critical-section-impl",
    "rp235xa",
] }
embassy-executor = { version = "0.10.0", features = [
    "platform-cortex-m",
    "executor-thread",
    "executor-interrupt",
    "defmt",
] }
embassy-time = { version = "0.5.0", features = ["defmt"] }
defmt = "1.0.1"
defmt-rtt = "1.1.0"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
cortex-m-rt = "0.7.5"
static_cell = "2.1.1"
