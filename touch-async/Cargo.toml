[package]
name = "touch-async"
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Rafael Koch <rafael.koch@gmx.net>"]
description = "Async XPT2046/TSC2046-class resistive touch driver"
repository = "https://github.com/1-rafael-1/explorer-robot"

[lints]
workspace = true

[dependencies]
embedded-hal = "1.0.0"
embedded-hal-async = "1.0.0"
embedded-graphics = { version = "0.8.1", default-features = false }

[features]
std = []

[[test]]
name = "driver"
required-features = ["std"]

[[test]]
name = "calibration"
required-features = ["std"]

[[test]]
name = "pressure"
required-features = ["std"]
